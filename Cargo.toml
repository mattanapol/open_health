[workspace]
resolver = "2"
members = [
    "crates/oura-cli",
    "crates/oura-ffi",
    "crates/oura-core",
    "crates/oura-summary",
    "crates/oura-dna",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Th0rgal/open_health"

[profile.release]
lto = true
strip = true

[patch."https://github.com/Th0rgal/open_oura"]
oura-store = { path = "vendor/oura-store" }
# Local (oura-break): build the ring crates from the sibling open_oura checkout so sync
# gets its drain fixes newer than the pinned rev (c36cd72, 8d454a5).
oura-protocol = { path = "../open_oura/crates/oura-protocol" }
oura-link = { path = "../open_oura/crates/oura-link" }
oura-analysis = { path = "../open_oura/crates/oura-analysis" }
